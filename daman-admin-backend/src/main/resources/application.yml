server:
  port: 8083

spring:
  application:
    name: daman-admin-backend

  datasource:
    url: jdbc:h2:file:${user.home}/daman_admin/admin/admin_data;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  h2:
    console:
      # OFF on purpose: /h2-console sits outside AuthFilter ('/api/*' only) and the DB is sa with a blank
      # password, so enabling it would expose an unauthenticated console if the ingress ever maps the whole hostname.
      enabled: false
      path: /h2-console

daman:
  workspace: ${DAMAN_WORKSPACE:D:/Daman/src}
  admin:
    # Only used the very first time the app runs (admin_users table is empty) to
    # seed the single admin login row — see AdminUserSeeder. Has no effect once
    # that row exists; change the password by updating admin_users.password_hash
    # directly (bcrypt) instead.
    seed-username: ${DAMAN_ADMIN_USERNAME:admin}
    seed-password: ${DAMAN_ADMIN_PASSWORD:ChangeMe123!}
  # AI announcement drafting. Keys come ONLY from the environment — never a committed file.
  # A missing key does not stop the portal booting: everything else here has nothing to do with
  # AI, and the first draft fails with a 401 that says so. See AnthropicConfig.
  ai:
    text-model: ${DAMAN_AI_TEXT_MODEL:claude-opus-5-5}
    image-model: ${DAMAN_AI_IMAGE_MODEL:gemini-2.5-flash-image}
    # A brake on a runaway loop, not an accounting record: counted in memory, reset at midnight
    # and on restart. A picture costs many times a paragraph, so they are capped separately.
    text-per-day: ${DAMAN_AI_TEXT_PER_DAY:60}
    images-per-day: ${DAMAN_AI_IMAGES_PER_DAY:20}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${DAMAN_AI_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  # Cloudflare (online-store provisioning). Token comes ONLY from the CLOUDFLARE_API_TOKEN env var.
  cloudflare:
    account-id: ${CLOUDFLARE_ACCOUNT_ID:}
    zone-id: ${CLOUDFLARE_ZONE_ID:}
    # The named tunnel each store's <sub>-api hostname is CNAME'd to (<id>.cfargotunnel.com).
    tunnel-id: ${CLOUDFLARE_TUNNEL_ID:}
  # Hosted ("online") stores — see HostedStoreProvisioningService. The unit dir and ingress file
  # are the server's real paths; they are properties only so a test or a dry run can redirect them.
  hosted:
    domain: ${DAMAN_HOSTED_DOMAIN:damansoft.com}
    pages-project: ${DAMAN_HOSTED_PAGES_PROJECT:daman-store}
    unit-dir: ${DAMAN_HOSTED_UNIT_DIR:/etc/systemd/system}
    ingress-file: ${DAMAN_HOSTED_INGRESS_FILE:/etc/cloudflared/config.yml}
